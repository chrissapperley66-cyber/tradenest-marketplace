<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="TradeNest - Buy, sell and discover great deals from people and businesses across London.">

<title>TradeNest | Buy. Sell. Discover.</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --dark: #111827;
    --text: #374151;
    --muted: #6b7280;
    --light: #f8fafc;
    --border: #e5e7eb;
    --white: #ffffff;
    --green: #16a34a;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f8fafc;
    color: var(--text);
    line-height: 1.6;
}

/* =========================
   HEADER
========================= */

header {
    background: rgba(255,255,255,0.97);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 1000;
}

.navbar {
    max-width: 1200px;
    margin: auto;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.logo {
    font-size: 27px;
    font-weight: 800;
    color: var(--dark);
    text-decoration: none;
}

.logo span {
    color: var(--primary);
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 24px;
}

.nav-links a {
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
}

.nav-links a:hover {
    color: var(--primary);
}

.nav-buttons {
    display: flex;
    align-items: center;
    gap: 10px;
}

.btn {
    display: inline-block;
    padding: 11px 18px;
    border-radius: 9px;
    text-decoration: none;
    font-weight: 700;
    border: none;
    cursor: pointer;
    transition: 0.2s;
}

.btn-primary {
    background: var(--primary);
    color: white;
}

.btn-primary:hover {
    background: var(--primary-dark);
    transform: translateY(-1px);
}

.btn-outline {
    border: 1px solid var(--border);
    background: white;
    color: var(--dark);
}

.btn-outline:hover {
    border-color: var(--primary);
    color: var(--primary);
}

/* =========================
   HERO
========================= */

.hero {
    background:
        radial-gradient(circle at top right, rgba(37,99,235,0.16), transparent 35%),
        linear-gradient(135deg, #eff6ff, #ffffff);
    padding: 80px 20px 70px;
}

.hero-container {
    max-width: 1100px;
    margin: auto;
    text-align: center;
}

.hero-badge {
    display: inline-block;
    background: #dbeafe;
    color: #1d4ed8;
    padding: 7px 14px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 20px;
}

.hero h1 {
    font-size: clamp(42px, 7vw, 72px);
    line-height: 1.05;
    color: var(--dark);
    margin-bottom: 20px;
    letter-spacing: -2px;
}

.hero h1 span {
    color: var(--primary);
}

.hero p {
    max-width: 680px;
    margin: 0 auto 32px;
    font-size: 19px;
    color: var(--muted);
}

.search-box {
    max-width: 850px;
    margin: auto;
    background: white;
    padding: 10px;
    border-radius: 14px;
    box-shadow: 0 15px 45px rgba(15,23,42,0.12);
    display: flex;
    gap: 10px;
}

.search-box input,
.search-box select {
    border: none;
    outline: none;
    padding: 15px;
    font-size: 16px;
    background: transparent;
}

.search-box input {
    flex: 1;
}

.search-box select {
    border-left: 1px solid var(--border);
}

.search-button {
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 9px;
    padding: 0 25px;
    font-weight: 700;
    cursor: pointer;
}

.hero-actions {
    margin-top: 25px;
}

.hero-actions a {
    margin: 5px;
}

/* =========================
   GENERAL
========================= */

.section {
    max-width: 1200px;
    margin: auto;
    padding: 70px 20px;
}

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: end;
    margin-bottom: 30px;
    gap: 20px;
}

.section-header h2 {
    font-size: 32px;
    color: var(--dark);
}

    color: var(--muted);
    margin-top: 5
