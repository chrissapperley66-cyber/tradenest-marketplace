<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="TradeNest - Buy, sell and discover great deals from people and businesses across London.">

<title>TradeNest | Buy. Sell. Discover.</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --dark: #111827;
    --text: #374151;
    --muted: #6b7280;
    --light: #f8fafc;
    --border: #e5e7eb;
    --white: #ffffff;
    --green: #16a34a;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--light);
    color: var(--text);
    line-height: 1.6;
}

header {
    background: rgba(255,255,255,0.97);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 1000;
}

.navbar {
    max-width: 1200px;
    margin: auto;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.logo {
    font-size: 27px;
    font-weight: 800;
    color: var(--dark);
    text-decoration: none;
}

.logo span {
    color: var(--primary);
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 24px;
}

.nav-links a {
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
}

.nav-links a:hover {
    color: var(--primary);
}

.nav-buttons {
    display: flex;
    align-items: center;
    gap: 10px;
}

.btn {
    display: inline-block;
    padding: 11px 18px;
    border-radius: 9px;
    text-decoration: none;
    font-weight: 700;
    border: none;
    cursor: pointer;
    transition: 0.2s;
}

.btn-primary {
    background: var(--primary);
    color: white;
}

.btn-primary:hover {
    background: var(--primary-dark);
    transform: translateY(-1px);
}

.btn-outline {
    border: 1px solid var(--border);
    background: white;
    color: var(--dark);
}

.btn-outline:hover {
    border-color: var(--primary);
    color: var(--primary);
}

/* HERO */

.hero {

        linear-gradient(135deg, #eff6ff, #ffffff);
    padding: 85px 20px 75px;
}

.hero-container {
    max-width: 1100px;
    margin: auto;
    text-align: center;
}

.hero-badge {
    display: inline-block;
    background: #dbeafe;
